openapi: 3.0.3
info:
  title: Clothing Line Commerce API
  description: |
    Headless e-commerce API for the clothing line storefront and admin consoles.

    This contract is the single source of truth shared by the storefront (Next.js), the
    backend adapters, and the mock (Prism). It is organised into six bounded contexts:

      - Admin     — catalogue administration, sales channels, regional pricing, tax,
                    promotions, roles, bulk imports, queue (dead-letter) operations.
      - Catalog   — storefront catalogue reads, search, category trees, cross-selling,
                    variant availability and product reviews.
      - Cart      — cart session lifecycle, line items (variant + custom B2B), discounts,
                    guest-cart merging.
      - Checkout  — shipping addresses, logistics quotes, insurance quotes, payment
                    session initialisation and async payment webhooks.
      - Customers — registration, JWT authentication, session revocation, password reset,
                    address books, B2B business units and quote requests.
      - Logistics — order returns (RMA), swaps, order edits, fulfilment dispatch, draft
                    orders and courier tracking webhooks.

    Conventions:

      * Money is always expressed as a non-negative **integer in minor units**
        (Kobo / Cents). Monetary fields end with the suffix `Minor` (e.g. `amountMinor`,
        `unitPriceMinor`, `refundAmountMinor`). Never send floating point money.
      * Errors are returned through a single envelope: `{ success: false, error: { code,
        message, details? } }` where `code` is one of the enumerated `ErrorCode` values.
      * All identifiers are opaque strings (uuid-shaped) generated by the backend.
      * Backend-private state (password hashes, security stamps, lockout counters, reset
        tokens) is never exposed; customer DTOs contain only public profile data.
  version: 1.0.0
servers:
  - url: http://localhost:4000
    description: Local Prism mock of the OpenAPI contract
  - url: https://api.example.com
    description: Production API
tags:
  - name: Admin
    description: Back-office catalogue and operations endpoints.
  - name: Catalog
    description: Storefront catalogue reads and reviews.
  - name: Cart
    description: Cart session and line-item lifecycle.
  - name: Checkout
    description: Shipping, insurance, payment intent and payment webhooks.
  - name: Customers
    description: Customer identity, profile, address book and B2B quotes.
  - name: Logistics
    description: Post-purchase returns, swaps, order edits and fulfilment.
security:
  - bearerAuth: []

paths:
  # =====================================================================
  # CATALOG (STORE CONTEXT)
  # =====================================================================
  /store/products:
    get:
      tags: [Catalog]
      summary: Browse the catalogue with filtering and pagination.
      description: |
        Returns a paginated, region- and channel-aware product list. Supports an optional
        category filter and free-text search. `expand`/`fields` projections are honoured by
        the read adapter when present.
      security: []
      parameters:
        - $ref: "#/components/parameters/SalesChannelHeader"
        - $ref: "#/components/parameters/RegionHeader"
        - name: searchQuery
          in: query
          required: false
          schema:
            type: string
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 10000000
            default: 0
        - $ref: "#/components/parameters/ExpandQuery"
        - $ref: "#/components/parameters/FieldsQuery"
      responses:
        "200":
          description: Paginated product list with a total count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/products/search:
    get:
      tags: [Catalog]
      summary: Full-text search over the product catalogue.
      security: []
      parameters:
        - $ref: "#/components/parameters/SalesChannelHeader"
        - $ref: "#/components/parameters/RegionHeader"
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 12
      responses:
        "200":
          description: Matching products.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/products/{id}:
    get:
      tags: [Catalog]
      summary: Retrieve detailed product information for a store context.
      security: []
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/SalesChannelHeader"
        - $ref: "#/components/parameters/RegionHeader"
        - $ref: "#/components/parameters/ExpandQuery"
        - $ref: "#/components/parameters/FieldsQuery"
      responses:
        "200":
          description: Product DTO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/products/{id}/related:
    get:
      tags: [Catalog]
      summary: Resolve cross-selling recommendations for a product.
      security: []
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/SalesChannelHeader"
        - $ref: "#/components/parameters/RegionHeader"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 4
      responses:
        "200":
          description: Recommended products.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/products/{id}/reviews:
    post:
      tags: [Catalog]
      summary: Submit a verified-buyer product review.
      description: |
        Only customers who purchased the product may review it (`UNAUTHORIZED_REVIEW`).
        A customer may submit a single review per product (`INVALID_OPERATION`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitReviewRequest"
      responses:
        "201":
          description: Review created.
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "403":
          $ref: "#/components/responses/StandardErrorResponse"
        "409":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/variants/{id}/availability:
    get:
      tags: [Catalog]
      summary: Check inventory, backorder and localized pricing for a variant.
      security: []
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/RegionHeader"
      responses:
        "200":
          description: Variant availability DTO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariantAvailability"
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/product-categories:
    get:
      tags: [Catalog]
      summary: Retrieve the category tree.
      security: []
      parameters:
        - name: includeDescendants
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Flat category list; tree structure is implied by `parentCategoryId`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  # =====================================================================
  # CART
  # =====================================================================
  /store/carts:
    post:
      tags: [Cart]
      summary: Initialize a new cart session.
      description: |
        Creates a transient cart bound to a region and sales channel. Both identifiers are
        required. An optional email and ISO country code may be attached.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitializeCartRequest"
      responses:
        "200":
          description: Newly created cart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/carts/{id}:
    get:
      tags: [Cart]
      summary: Retrieve the current state of a cart.
      security: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Cart DTO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/carts/{id}/line-items:
    post:
      tags: [Cart]
      summary: Add a product variant line item to the cart.
      description: |
        Resolves the regional price server-side. Rejects when inventory is insufficient and
        backordering is disabled (`OUT_OF_STOCK`) or when no regional price exists
        (`REGIONAL_PRICE_MISSING`).
      security: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddLineItemRequest"
      responses:
        "204":
          description: Line item added. Retrieve the cart via GET /store/carts/{id}.
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "409":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/carts/{id}/line-items/custom:
    post:
      tags: [Cart]
      summary: Add a custom (B2B) line item with an explicit title and unit price.
      description: |
        Custom line items have no variant; the client supplies `title`, `quantity` and
        `unitPriceMinor` (integer minor units, non-negative).
      security: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCustomLineItemRequest"
      responses:
        "204":
          description: Custom line item added.
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/carts/{id}/line-items/{line_id}:
    put:
      tags: [Cart]
      summary: Update the quantity of an existing line item.
      description: |
        Variant-backed items are re-validated against current inventory; custom items only
        respect the quantity bounds.
      security: []
      parameters:
        - $ref: "#/components/parameters/PathId"
        - name: line_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLineItemQuantityRequest"
      responses:
        "204":
          description: Quantity updated.
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "409":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"
    delete:
      tags: [Cart]
      summary: Remove a line item from the cart.
      security: []
      parameters:
        - $ref: "#/components/parameters/PathId"
        - name: line_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Line item removed.
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/carts/{id}/discount:
    post:
      tags: [Cart]
      summary: Apply a promotion code to the cart.
      description: |
        Only one active discount may be applied per cart. The code is case-insensitive and
        normalised to uppercase. Rejects inactive/unknown codes and codes whose minimum spend
        is not met.
      security: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyDiscountRequest"
      responses:
        "204":
          description: Discount applied.
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "409":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/carts/{id}/merge:
    post:
      tags: [Cart]
      summary: Merge a guest cart into the authenticated customer's active cart.
      description: |
        Matching line items (same variant, unit price, title and metadata) are merged by
        summing quantities; unmatched items are copied. The guest cart is deleted.
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeGuestCartRequest"
      responses:
        "204":
          description: Carts merged.
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "409":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  # =====================================================================
  # CHECKOUT
  # =====================================================================
  /store/carts/{id}/shipping-address:
    put:
      tags: [Checkout]
      summary: Set the checkout shipping address and recompute regional tax.
      description: |
        The address is stored as a JSONB object. Tax is recalculated for the address via the
        tax service; any validated `taxAmountMinor` is persisted on the cart.
      security: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetShippingAddressRequest"
      responses:
        "204":
          description: Shipping address applied.
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/carts/{id}/shipping-quotes:
    post:
      tags: [Checkout]
      summary: Retrieve dynamic shipping quotes for the cart.
      description: |
        Quotes are fetched from the logistics provider (e.g. Shipbubble). A shipping address
        must be set first (`INVALID_STATE` otherwise).
      security: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Available shipping quotes, capped at 50.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShippingQuote"
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "409":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/carts/{id}/insurance-quote:
    post:
      tags: [Checkout]
      summary: Fetch an embedded insurance quote for the cart value.
      description: |
        Quotes are computed by the insurance provider (e.g. Curacel) from the cart total.
      security: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Insurance premium in minor units.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsuranceQuoteResponse"
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "409":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/carts/{id}/payment-sessions:
    post:
      tags: [Checkout]
      summary: Initialize a payment intent for the cart.
      description: |
        Initialises a cryptographic payment intent with the payment gateway and returns the
        hosted authorization URL. Rejects empty carts, carts already initialized, or carts
        already paid.
      security: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentSessionRequest"
      responses:
        "200":
          description: Payment authorization URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSessionResponse"
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "409":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/carts/{id}/complete:
    post:
      tags: [Checkout]
      summary: Complete checkout and convert the cart into an immutable order.
      security: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Finalized order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "409":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/payments/webhook:
    post:
      tags: [Checkout]
      summary: Payment gateway webhook for order finalization.
      description: |
        Asynchronous payment-confirmation webhook. The raw body is verified with an HMAC-SHA512
        signature (`PAYMENT_VERIFICATION_FAILED` on mismatch). Idempotent via the transaction
        reference; the cart is converted to an order and a transaction record persisted.
        Rejects when the paid amount differs from the cart total (`INVALID_PAYMENT_AMOUNT`).
      security: []
      parameters:
        - name: X-Payment-Signature
          in: header
          required: true
          description: HMAC-SHA512 signature of the raw request body.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookPaymentFinalizeRequest"
      responses:
        "200":
          description: Finalized order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "409":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  # =====================================================================
  # CUSTOMERS & AUTHENTICATION
  # =====================================================================
  /store/auth:
    post:
      tags: [Customers]
      summary: Authenticate a customer and issue a JWT.
      description: |
        Returns a signed access token. Credentials are checked via constant-time comparison;
        unknown emails and bad passwords both yield `INVALID_CREDENTIALS`. Accounts that are
        disabled or locked return `ACCOUNT_DISABLED` / `ACCOUNT_LOCKED`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthenticateRequest"
      responses:
        "200":
          description: JWT access token.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken]
                properties:
                  accessToken:
                    type: string
                    description: Signed JWT carrying customerId, roles and email.
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "401":
          $ref: "#/components/responses/StandardErrorResponse"
        "423":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/customers:
    post:
      tags: [Customers]
      summary: Register a new customer account.
      description: |
        Creates a customer profile with a hashed password. Emails are lowercased; duplicate
        registration yields `CUSTOMER_ALREADY_EXISTS`. The response contains only public
        profile data.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterCustomerRequest"
      responses:
        "201":
          description: Customer profile created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "409":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/customers/me:
    get:
      tags: [Customers]
      summary: Retrieve the authenticated customer's public profile.
      responses:
        "200":
          description: Customer DTO (no backend-private fields).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/customers/logout:
    post:
      tags: [Customers]
      summary: Revoke the current session via the token denylist.
      description: |
        Revokes the presented JWT (Redis denylist). Supports revoking a single token or all
        sessions for a user.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  default: MANUAL_REVOCATION
      responses:
        "204":
          description: Session(s) revoked.
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "401":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/customers/password-reset/initiate:
    post:
      tags: [Customers]
      summary: Initiate a password reset.
      description: |
        Issues a single-use reset token (default 1h TTL) and emails it. Always succeeds for
        unknown emails to prevent enumeration.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiatePasswordResetRequest"
      responses:
        "204":
          description: Reset email dispatched (or suppressed for unknown accounts).
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/customers/password-reset/complete:
    post:
      tags: [Customers]
      summary: Complete a password reset with the emailed token.
      description: |
        Verifies the token (including token-id and hash match), re-hashes the password,
        bumps the security stamp and revokes all sessions. Invalid/expired tokens yield
        `UNAUTHORIZED_ACCESS`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletePasswordResetRequest"
      responses:
        "204":
          description: Password updated and sessions revoked.
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "401":
          $ref: "#/components/responses/StandardErrorResponse"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/customers/me/addresses:
    get:
      tags: [Customers]
      summary: List the authenticated customer's address book.
      responses:
        "200":
          description: Address list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Address"
        "401":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"
    post:
      tags: [Customers]
      summary: Add an address to the customer's address book.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
      responses:
        "204":
          description: Address added.
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "401":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/customers/me/addresses/{address_id}:
    put:
      tags: [Customers]
      summary: Update an existing address book entry.
      parameters:
        - $ref: "#/components/parameters/PathAddressId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
      responses:
        "204":
          description: Address updated.
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "401":
          $ref: "#/components/responses/StandardErrorResponse"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"
    delete:
      tags: [Customers]
      summary: Delete an address book entry.
      parameters:
        - $ref: "#/components/parameters/PathAddressId"
      responses:
        "204":
          description: Address removed.
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "401":
          $ref: "#/components/responses/StandardErrorResponse"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/customers/me/business-units:
    post:
      tags: [Customers]
      summary: Create a B2B business unit.
      description: |
        Creates a business unit and promotes the given customer to `COMPANY_ADMIN`.
        Duplicate registration numbers or names yield `BUSINESS_UNIT_ALREADY_EXISTS`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBusinessUnitRequest"
      responses:
        "201":
          description: Business unit created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessUnit"
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "409":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/customers/me/quotes:
    post:
      tags: [Customers]
      summary: Request a B2B quote for a cart.
      description: |
        Snapshots the cart (truncated at 200KB), binds it to a business unit, and may freeze
        the cart for the quoting period. The requesting customer must own the cart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestQuoteRequest"
      responses:
        "202":
          description: Quote request accepted.
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "409":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/quotes/{id}/approve:
    post:
      tags: [Customers]
      summary: Approve a pending B2B quote.
      description: |
        Approves a `PENDING_APPROVAL` quote with an approved total in minor units. Any other
        status yields `INVALID_STATE`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveQuoteRequest"
      responses:
        "204":
          description: Quote approved.
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "409":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/customers/me/orders:
    get:
      tags: [Customers]
      summary: Retrieve the authenticated customer's paginated order history.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated order history.
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                  total:
                    type: integer
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "401":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/customers/me/erasure:
    post:
      tags: [Customers]
      summary: Request GDPR/CCPA data erasure for the authenticated customer.
      description: |
        Anonymizes all personal data, revokes all sessions and records the erasure reason.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  default: DATA_ERASURE_REQUEST
      responses:
        "204":
          description: Customer data anonymized.
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "401":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  # =====================================================================
  # LOGISTICS (POST-PURCHASE)
  # =====================================================================
  /store/orders/{id}:
    get:
      tags: [Logistics]
      summary: Retrieve an immutable order with line items and fulfilment state.
      security: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Order DTO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/orders/{id}/returns:
    post:
      tags: [Logistics]
      summary: Initiate a return authorization with prorated refund calculation.
      description: |
        Validates each item and quantity against the fulfilled order, computes the prorated
        refund (`refundAmountMinor`), and optionally creates a return label. Missing items or
        excessive quantities yield `INVALID_RETURN_ITEM` / `INVALID_RETURN_QUANTITY`.
      security: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnRequest"
      responses:
        "201":
          description: Return authorization created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnAuthorization"
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "409":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/orders/{id}/swaps:
    post:
      tags: [Logistics]
      summary: Process an order swap and compute the price variance.
      description: |
        Computes the signed variance between the returned line value and the replacement
        variant. Positive variance requires payment (`PAYMENT_REQUIRED` with a payment URL),
        negative variance dispatches a refund, zero is an even exchange.
      security: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwapRequest"
      responses:
        "201":
          description: Swap processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Swap"
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "409":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/orders/{id}/edits:
    post:
      tags: [Logistics]
      summary: Propose an edit to an unfulfilled order.
      description: |
        Computes the monetary difference of the proposed changes (`differenceDueMinor`).
        Unfulfilled orders only — fulfilled orders yield `ORDER_ALREADY_FULFILLED`.
      security: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposeOrderEditRequest"
      responses:
        "201":
          description: Order edit proposed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderEdit"
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "409":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/order-edits/{id}/confirm:
    post:
      tags: [Logistics]
      summary: Confirm a proposed order edit.
      description: |
        When the edit increases the order total, payment must be confirmed first
        (`PAYMENT_REQUIRED`). Applies the confirmed edits to the live order. Idempotent —
        already-confirmed edits return their current status.
      security: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmOrderEditRequest"
      responses:
        "200":
          description: Order edit confirmed.
          content:
            application/json:
              schema:
                type: object
                required: [orderId, orderEditId, status]
                properties:
                  orderId:
                    type: string
                    format: uuid
                  orderEditId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: applied
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "402":
          $ref: "#/components/responses/StandardErrorResponse"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/orders/{id}/fulfillments:
    post:
      tags: [Logistics]
      summary: Dispatch an order and request a shipping label.
      description: |
        Requests a label from the logistics provider, records the fulfilment with tracking
        information, and transitions the order to `fulfilled`. Only `unfulfilled` or
        `ready_for_dispatch` orders may be dispatched (`INVALID_STATE`).
      security: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchFulfillmentRequest"
      responses:
        "204":
          description: Order dispatched.
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "409":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /store/webhooks/courier-tracking:
    post:
      tags: [Logistics]
      summary: Courier tracking status webhook.
      description: |
        Accepts tracking events, updates the matching fulfilment, and optionally notifies the
        customer. Unknown tracking numbers are ignored idempotently; out-of-order events are
        dropped.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourierTrackingWebhook"
      responses:
        "204":
          description: Tracking event processed (or ignored).
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  # =====================================================================
  # ADMIN
  # =====================================================================
  /admin/products:
    post:
      tags: [Admin]
      summary: Create a product.
      description: |
        Normalizes and validates the handle (`^[a-z0-9-_]+$`, length 2–100). A handle conflict
        yields `INVALID_OPERATION`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Product created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "409":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /admin/products/{id}/variants:
    post:
      tags: [Admin]
      summary: Create a product variant.
      description: |
        SKU is normalized to uppercase and must match `^[A-Z0-9-_]+$`. Inventory is bounded
        (0..1,000,000,000). Duplicate SKUs yield `INVALID_OPERATION`.
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductVariantRequest"
      responses:
        "201":
          description: Variant created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductVariant"
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "409":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /admin/variants/{id}/inventory:
    post:
      tags: [Admin]
      summary: Adjust a variant's inventory to an absolute level.
      description: |
        Requires `inventory.adjust` permission. Sets the absolute inventory quantity (integer,
        0..1,000,000,000) and audits the adjustment with a reason.
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustInventoryRequest"
      responses:
        "204":
          description: Inventory adjusted.
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "401":
          $ref: "#/components/responses/StandardErrorResponse"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /admin/variants/{id}/regional-prices:
    post:
      tags: [Admin]
      summary: Configure a regional price for a variant.
      description: |
        Amounts are integers in minor units (0..100,000,000,000). Creating a price for a
        variant/region pair that already has one yields `INVALID_OPERATION`.
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigureRegionalPricingRequest"
      responses:
        "204":
          description: Regional price configured.
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "409":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /admin/tax-categories:
    post:
      tags: [Admin]
      summary: Configure a tax category for a region.
      description: |
        Rate is expressed in basis points (0..10,000; e.g. 750 = 7.5%). Duplicate names within
        a region yield `INVALID_OPERATION`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigureTaxCategoryRequest"
      responses:
        "204":
          description: Tax category configured.
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "409":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /admin/promotions:
    post:
      tags: [Admin]
      summary: Create a promotion rule.
      description: |
        Code is normalized to uppercase (`^[A-Z0-9-_]+$`). Percentage discounts are bounded to
        10,000 basis points; fixed amounts to 1,000,000,000 minor units. Duplicate codes yield
        `INVALID_OPERATION`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePromotionRequest"
      responses:
        "204":
          description: Promotion created.
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "409":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /admin/sales-channels:
    post:
      tags: [Admin]
      summary: Create a sales channel.
      description: |
        Name is required (max 200 chars) and description optional (max 2000 chars). A channel
        colliding with an existing unique constraint yields `INVALID_OPERATION`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSalesChannelRequest"
      responses:
        "201":
          description: Sales channel created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesChannel"
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "409":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /admin/categories:
    post:
      tags: [Admin]
      summary: Create a product category.
      description: |
        Name is required (max 200 chars). An optional parent category must exist and cannot
        self-reference.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Category created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "409":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /admin/roles/{id}/permissions:
    put:
      tags: [Admin]
      summary: Replace the permission set of an admin role.
      description: |
        Permissions are lowercased, de-duplicated and must match `^[a-z0-9]+:[a-z0-9-]+$`
        (e.g. `read:products`).
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManageRolePermissionsRequest"
      responses:
        "204":
          description: Role permissions updated.
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "409":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /admin/imports/bulk-catalog:
    post:
      tags: [Admin]
      summary: Enqueue a bulk catalogue import job.
      description: |
        Accepts an HTTP(S) file URL and optional file type (`csv`|`json`), then schedules a
        background import job. Returns the generated job id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkImportRequest"
      responses:
        "202":
          description: Import job scheduled.
          content:
            application/json:
              schema:
                type: object
                required: [jobId]
                properties:
                  jobId:
                    type: string
                    format: uuid
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /admin/queues/{queue_name}/dead-letter:
    get:
      tags: [Admin]
      summary: List dead-letter jobs for a queue.
      parameters:
        - $ref: "#/components/parameters/PathQueueName"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 10000000
            default: 0
      responses:
        "200":
          description: Dead-letter jobs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeadLetterJob"
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /admin/queues/{queue_name}/dead-letter/{job_id}/retry:
    post:
      tags: [Admin]
      summary: Retry a dead-letter job.
      parameters:
        - $ref: "#/components/parameters/PathQueueName"
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Job re-queued for processing.
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "404":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /admin/draft-orders:
    post:
      tags: [Admin]
      summary: Generate a draft order and optionally email an invoice.
      description: |
        Creates a snapshot draft order (`awaiting_payment`) with an explicit total in minor
        units. Requires an admin id. Duplicate snapshots yield `DUPLICATE_DRAFT_ORDER`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftOrderRequest"
      responses:
        "201":
          description: Draft order created.
          content:
            application/json:
              schema:
                type: object
                required: [draftOrderId]
                properties:
                  draftOrderId:
                    type: string
                    format: uuid
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "409":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /admin/sourcing-location:
    post:
      tags: [Admin]
      summary: Determine the optimal sourcing location for a variant.
      description: |
        Resolves the optimal fulfilment node for a variant/quantity given customer
        coordinates. May split across locations when allowed. Yields `OUT_OF_STOCK` when no
        location can serve the quantity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourcingRequest"
      responses:
        "200":
          description: Optimal sourcing location.
          content:
            application/json:
              schema:
                type: object
                required: [locationId]
                properties:
                  locationId:
                    type: string
                    format: uuid
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /admin/carts/prune:
    post:
      tags: [Admin]
      summary: Prune abandoned carts older than a threshold.
      description: |
        System maintenance operation. Deletes carts whose last activity predates the given
        threshold and returns the number deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expirationDateThreshold]
              properties:
                expirationDateThreshold:
                  type: string
                  format: date-time
                  description: Carts older than this timestamp are removed.
      responses:
        "200":
          description: Pruned abandoned carts.
          content:
            application/json:
              schema:
                type: object
                required: [deletedCount]
                properties:
                  deletedCount:
                    type: integer
                    minimum: 0
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

  /admin/maintenance/stale-transactions:
    post:
      tags: [Admin]
      summary: Terminate stale database transactions.
      description: |
        System maintenance operation. Terminates transactions older than the given stale
        threshold (ms, clamped 0..3,600,000).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                staleThresholdMs:
                  type: integer
                  minimum: 0
                  maximum: 3600000
                  default: 30000
      responses:
        "200":
          description: Terminated stale transactions.
          content:
            application/json:
              schema:
                type: object
                required: [terminatedCount]
                properties:
                  terminatedCount:
                    type: integer
                    minimum: 0
        "400":
          $ref: "#/components/responses/StandardErrorResponse"
        "500":
          $ref: "#/components/responses/StandardErrorResponse"

# =====================================================================
# COMPONENTS
# =====================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by POST /store/auth.

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PathAddressId:
      name: address_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PathQueueName:
      name: queue_name
      in: path
      required: true
      schema:
        type: string
    SalesChannelHeader:
      name: sales_channel_id
      in: header
      required: false
      description: Scopes catalogue reads to a specific sales channel.
      schema:
        type: string
        format: uuid
    RegionHeader:
      name: region_id
      in: header
      required: false
      description: Scopes catalogue reads to a specific region (currency, tax, pricing).
      schema:
        type: string
        format: uuid
    ExpandQuery:
      name: expand
      in: query
      required: false
      description: Comma-separated nested relations to expand (e.g. `variants,options`).
      schema:
        type: string
        example: variants
    FieldsQuery:
      name: fields
      in: query
      required: false
      description: Comma-separated subset of fields to project (e.g. `id,title,thumbnail`).
      schema:
        type: string
        example: id,title

  responses:
    StandardErrorResponse:
      description: Standardized error envelope used by every non-2xx response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StandardError"

  schemas:
    # ------------------------------------------------------------------
    # Global envelope
    # ------------------------------------------------------------------
    StandardError:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - INVALID_EMAIL
                - NEGATIVE_AMOUNT
                - INVALID_CURRENCY
                - INVALID_OPERATION
                - INVALID_STATE
                - INVALID_STATUS_TRANSITION
                - OUT_OF_STOCK
                - REGIONAL_PRICE_MISSING
                - INTERNAL_ERROR
                - JOB_PROCESSING_ERROR
                - PAYMENT_VERIFICATION_FAILED
                - EXTERNAL_SERVICE_TIMEOUT
                - EXTERNAL_SERVICE_UNAVAILABLE
                - EXTERNAL_SERVICE_ERROR
                - LOCK_ACQUISITION_FAILED
                - UNSUPPORTED_OPERATION
                - ORDER_ALREADY_FULFILLED
                - INVALID_RETURN_QUANTITY
                - DUPLICATE_DRAFT_ORDER
                - PAYMENT_REQUIRED
                - INVALID_RETURN_ITEM
                - INVALID_INPUT
                - DUPLICATE_TRANSACTION
                - TRANSACTION_NOT_FOUND
                - INVALID_PAYMENT_AMOUNT
                - PERMISSION_DENIED
                - DUPLICATE_QUOTE
                - UNAUTHORIZED
                - UNAUTHORIZED_REVIEW
                - INVALID_CREDENTIALS
                - UNAUTHORIZED_ACCESS
                - CUSTOMER_ALREADY_EXISTS
                - COMPLIANCE_VIOLATION
                - ACCOUNT_DISABLED
                - ACCOUNT_LOCKED
                - BUSINESS_UNIT_ALREADY_EXISTS
                - PAYMENT_DECLINED
                - INVALID_SIGNATURE
                - RESOURCE_NOT_FOUND
                - CART_NOT_FOUND
                - PRODUCT_NOT_FOUND
              example: OUT_OF_STOCK
            message:
              type: string
              example: Requested quantity exceeds available inventory.
            details:
              type: object
              additionalProperties: true

    # ------------------------------------------------------------------
    # Catalog DTOs
    # ------------------------------------------------------------------
    Product:
      type: object
      description: Public product DTO (no backend-private catalogue state).
      required: [id, title, handle]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        handle:
          type: string
        description:
          type: string
          nullable: true
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariant"

    ProductVariant:
      type: object
      description: Product variant DTO with inventory and backorder flag.
      required: [id, productId, sku, inventoryQuantity, allowBackorder, version]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        sku:
          type: string
        inventoryQuantity:
          type: integer
          minimum: 0
          maximum: 1000000000
        allowBackorder:
          type: boolean
          description: When true, the variant may be oversold against inventory.
        version:
          type: integer
          description: Optimistic-lock version, incremented on every inventory change.

    ProductList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total:
          type: integer
          description: Total number of products matching the query.

    VariantAvailability:
      type: object
      required: [variantId, inventoryQuantity, allowBackorder, priceMinor]
      properties:
        variantId:
          type: string
          format: uuid
        inventoryQuantity:
          type: integer
          minimum: 0
        allowBackorder:
          type: boolean
        priceMinor:
          type: integer
          minimum: 0
          nullable: true
          description: Regional price in minor units; null when no regional price exists.

    Category:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        parentCategoryId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time

    Collection:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string

    # ------------------------------------------------------------------
    # Cart DTOs
    # ------------------------------------------------------------------
    Cart:
      type: object
      description: Cart session DTO including computed totals and applied promotion.
      required: [id, regionId, salesChannelId, status, items, cartTotalMinor]
      properties:
        id:
          type: string
          format: uuid
        regionId:
          type: string
          format: uuid
        salesChannelId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        createdAt:
          type: string
          format: date-time
        countryCode:
          type: string
          nullable: true
          example: NG
        currency:
          type: string
          example: NGN
        shippingAddress:
          $ref: "#/components/schemas/ShippingAddress"
        taxAmountMinor:
          type: integer
          minimum: 0
          nullable: true
          description: Applied tax in minor units; null before tax is calculated.
        metadata:
          type: object
          additionalProperties: true
          description: Arbitrary JSONB metadata attached to the cart.
        frozen:
          type: boolean
        frozenReason:
          type: string
          nullable: true
        frozenAt:
          type: string
          format: date-time
          nullable: true
        orderId:
          type: string
          format: uuid
          nullable: true
        convertedAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [active, converted]
        paymentStatus:
          type: string
          enum: [pending, initialized, paid]
        paymentInitialized:
          type: boolean
        paymentAuthorizationUrl:
          type: string
          nullable: true
        paymentInitializedAt:
          type: string
          format: date-time
          nullable: true
        cartTotalMinor:
          type: integer
          minimum: 0
          description: Sum of all line-item totals in minor units.
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartLineItem"
        appliedPromotion:
          $ref: "#/components/schemas/AppliedPromotion"

    CartLineItem:
      type: object
      description: A single cart line item. Variant items reference a variant; custom (B2B) items carry a title and client-supplied unit price instead.
      required: [id, cartId, quantity, unitPriceMinor, createdAt]
      properties:
        id:
          type: string
          format: uuid
        cartId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          nullable: true
          description: Required for custom items.
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
        unitPriceMinor:
          type: integer
          minimum: 0
          description: Unit price in minor units.
        lineTotalMinor:
          type: integer
          minimum: 0
          description: Computed unitPriceMinor * quantity in minor units.
        metadata:
          type: object
          additionalProperties: true
          description: Arbitrary JSONB metadata attached to the line item.
        createdAt:
          type: string
          format: date-time

    AppliedPromotion:
      type: object
      description: Promotion projection attached to a cart (only id and code are exposed).
      required: [id, code]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string

    # ------------------------------------------------------------------
    # Checkout DTOs
    # ------------------------------------------------------------------
    ShippingAddress:
      type: object
      description: Checkout shipping address. Stored as JSONB; unknown keys are preserved.
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        company:
          type: string
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        countryCode:
          type: string
          example: NG
        isBusiness:
          type: boolean
          default: false
        metadata:
          type: object
          additionalProperties: true
      additionalProperties: true

    ShippingQuote:
      type: object
      description: Logistics quote returned by the provider (e.g. Shipbubble).
      properties:
        id:
          type: string
          format: uuid
        serviceLevel:
          type: string
          example: standard
        amountMinor:
          type: integer
          minimum: 0
          description: Quote amount in minor units.
        currency:
          type: string
          example: NGN
        etaDays:
          type: integer
          minimum: 0

    InsuranceQuoteResponse:
      type: object
      required: [premiumMinor]
      properties:
        premiumMinor:
          type: integer
          minimum: 0
          description: Insurance premium in minor units.

    PaymentSessionResponse:
      type: object
      required: [authorizationUrl]
      properties:
        authorizationUrl:
          type: string
          format: uri
          description: Hosted payment authorization URL returned by the gateway.

    # ------------------------------------------------------------------
    # Order DTOs
    # ------------------------------------------------------------------
    Order:
      type: object
      description: Immutable order DTO with fulfilment and payment state.
      required:
        [
          id,
          cartId,
          customerId,
          totalAmountMinor,
          fulfillmentStatus,
          paymentStatus,
        ]
      properties:
        id:
          type: string
          format: uuid
        cartId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        totalAmountMinor:
          type: integer
          minimum: 0
          description: Captured order total in minor units (Kobo).
        fulfillmentStatus:
          type: string
          enum:
            - unfulfilled
            - ready_for_dispatch
            - partially_fulfilled
            - fulfilled
            - returned
            - on_hold
        paymentStatus:
          type: string
          enum: [pending, captured, failed, requires_action, on_hold]
        transactionReference:
          type: string
          nullable: true
        paymentStatusReason:
          type: string
          nullable: true
        paymentStatusUpdatedAt:
          type: string
          format: date-time
          nullable: true
        flaggedForReview:
          type: boolean
        flagReason:
          type: string
          nullable: true
        riskScore:
          type: integer
          nullable: true
        flaggedAt:
          type: string
          format: date-time
          nullable: true
        fulfillmentHaltedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
          description: Arbitrary JSONB metadata attached to the order.
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/OrderLineItem"
        availableVariants:
          type: array
          items:
            type: object
            required: [id, unitPriceMinor]
            properties:
              id:
                type: string
                format: uuid
              unitPriceMinor:
                type: integer
                minimum: 0
        fulfillments:
          type: array
          items:
            $ref: "#/components/schemas/Fulfillment"
        pendingReturns:
          type: array
          items:
            type: object
            additionalProperties: true

    OrderLineItem:
      type: object
      required: [id, quantity, unitPriceMinor]
      properties:
        id:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
          nullable: true
        quantity:
          type: integer
          minimum: 1
        unitPriceMinor:
          type: integer
          minimum: 0
        fulfilledQuantity:
          type: integer
          minimum: 0
          nullable: true

    Transaction:
      type: object
      description: Captured payment transaction linked to an order.
      required: [id, orderId, reference, amountMinor]
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        reference:
          type: string
          description: Gateway transaction reference.
        amountMinor:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time

    Fulfillment:
      type: object
      description: Shipping fulfilment record attached to an order.
      required: [id, orderId, trackingNumber, status]
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        trackingNumber:
          type: string
        courier:
          type: string
        labelUrl:
          type: string
          nullable: true
        serviceLevel:
          type: string
          nullable: true
        status:
          type: string
          enum:
            [
              pending_dispatch,
              in_transit,
              out_for_delivery,
              delivered,
              delivery_failed,
            ]
        createdAt:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true

    # ------------------------------------------------------------------
    # Customer DTOs
    # ------------------------------------------------------------------
    Customer:
      type: object
      description: Public customer profile. Backend-private fields are never exposed.
      required: [id, firstName, lastName, email]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        activeCartId:
          type: string
          format: uuid
          nullable: true
        registeredAt:
          type: string
          format: date-time
        phone:
          type: string
          nullable: true
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/Address"
        disabled:
          type: boolean
        roles:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true
          description: Arbitrary JSONB metadata attached to the customer.

    Address:
      type: object
      description: Address book entry. Stored as JSONB; unknown keys are preserved.
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        company:
          type: string
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        countryCode:
          type: string
          example: NG
        isDefault:
          type: boolean
          default: false
        metadata:
          type: object
          additionalProperties: true
      additionalProperties: true

    BusinessUnit:
      type: object
      description: B2B business unit with its members.
      required:
        [id, name, registrationNumber, salesChannelId, members, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        registrationNumber:
          type: string
        salesChannelId:
          type: string
          format: uuid
        members:
          type: array
          items:
            type: object
            required: [customerId, role]
            properties:
              customerId:
                type: string
                format: uuid
              role:
                type: string
                enum: [COMPANY_ADMIN]
        createdAt:
          type: string
          format: date-time

    Quote:
      type: object
      description: B2B quote request attached to a business unit.
      required:
        - id
        - cartId
        - businessUnitId
        - requestedByCustomerId
        - requestedAt
        - status
      properties:
        id:
          type: string
          format: uuid
        cartId:
          type: string
          format: uuid
        cartSnapshotJson:
          type: string
          description: Serialized cart snapshot (truncated at 200KB).
        businessUnitId:
          type: string
          format: uuid
        requestedByCustomerId:
          type: string
          format: uuid
        requestedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [PENDING_APPROVAL, APPROVED, REJECTED]
        notes:
          type: string
          nullable: true
        approvedTotalMinor:
          type: integer
          minimum: 0
          nullable: true
          description: Approved total in minor units; set on approval.
        approvedBy:
          type: string
          format: uuid
          nullable: true
        approvedAt:
          type: string
          format: date-time
          nullable: true
        approvalNote:
          type: string
          nullable: true

    # ------------------------------------------------------------------
    # Logistics DTOs
    # ------------------------------------------------------------------
    ReturnAuthorization:
      type: object
      description: Return authorization (RMA) with prorated refund.
      required: [id, orderId, refundAmountMinor, status]
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        items:
          type: array
          items:
            type: object
            required: [lineItemId, quantity, reasonCode]
            properties:
              lineItemId:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 1
              reasonCode:
                type: string
        refundAmountMinor:
          type: integer
          minimum: 0
          description: Prorated refund in minor units.
        shippingLabelUrl:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending_receipt]
        requestedByCustomerId:
          type: string
          format: uuid
          nullable: true
        createdBy:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true

    Swap:
      type: object
      description: Swap processing result including the signed price variance.
      required: [swapId, variance, action]
      properties:
        swapId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        returnLineItemId:
          type: string
          format: uuid
        returnQuantity:
          type: integer
          minimum: 1
        newVariantId:
          type: string
          format: uuid
        newVariantPriceMinor:
          type: integer
          minimum: 0
        originalValueMinor:
          type: integer
          minimum: 0
        variance:
          type: integer
          description: Signed variance in minor units (positive = customer owes).
        action:
          type: string
          enum: [EVEN_EXCHANGE, PAYMENT_REQUIRED, REFUND_DISPATCHED]
        paymentUrl:
          type: string
          format: uri
          nullable: true
        status:
          type: string
          enum:
            [
              even_exchange,
              awaiting_payment,
              refund_dispatched,
              refund_pending_manual,
            ]
        createdAt:
          type: string
          format: date-time
        paymentReference:
          type: string
          nullable: true

    OrderEdit:
      type: object
      description: Proposed or confirmed edit to an unfulfilled order.
      required: [id, orderId, actionType, status]
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        actionType:
          type: string
          example: proposed_edit
        reason:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, proposed, confirmed, applied]
        differenceDueMinor:
          type: integer
          description: Signed monetary difference in minor units (positive = customer owes).
        proposedChanges:
          type: array
          items:
            type: object
            required: [type, quantity]
            properties:
              type:
                type: string
                enum: [add, remove, update]
              lineItemId:
                type: string
                format: uuid
                nullable: true
              newVariantId:
                type: string
                format: uuid
                nullable: true
              quantity:
                type: integer
                minimum: 1
              unitPriceMinor:
                type: integer
                minimum: 0
        confirmedAt:
          type: string
          format: date-time
          nullable: true
        confirmedBy:
          type: string
          format: uuid
          nullable: true
        paymentReference:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    DeadLetterJob:
      type: object
      description: Failed background job surfaced for inspection and retry.
      required: [id]
      properties:
        id:
          type: string
        name:
          type: string
        data:
          type: object
          additionalProperties: true
        failedReason:
          type: string
        attemptsMade:
          type: integer
          minimum: 0
        timestamp:
          type: string
          nullable: true
        failedAt:
          type: string
          nullable: true

    DraftOrder:
      type: object
      description: Administrative draft order awaiting payment.
      required: [id, email, items, totalMinor, status]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        items:
          type: array
          items:
            type: object
            required: [title, quantity, unitPriceMinor]
            properties:
              title:
                type: string
              quantity:
                type: integer
                minimum: 1
              unitPriceMinor:
                type: integer
                minimum: 0
        shippingAddress:
          type: object
          additionalProperties: true
        totalMinor:
          type: integer
          minimum: 0
          description: Draft order total in minor units.
        status:
          type: string
          enum: [awaiting_payment]
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true

    # ------------------------------------------------------------------
    # Admin DTOs
    # ------------------------------------------------------------------
    SalesChannel:
      type: object
      required: [id, name, isDisabled, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        isDisabled:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Region:
      type: object
      required: [id, name, currencyCode, taxRate]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        currencyCode:
          type: string
          example: NGN
        taxRate:
          type: integer
          minimum: 0
          description: Tax rate in basis points.
        paymentProviders:
          type: array
          items:
            type: string
        fulfillmentProviders:
          type: array
          items:
            type: string

    TaxCategory:
      type: object
      required: [id, regionId, name, rate]
      properties:
        id:
          type: string
          format: uuid
        regionId:
          type: string
          format: uuid
        name:
          type: string
        rate:
          type: integer
          minimum: 0
          maximum: 10000
          description: Tax rate in basis points (e.g. 750 = 7.5%).

    Promotion:
      type: object
      description: Promotion rule used for discount codes.
      required:
        [
          id,
          code,
          discountType,
          discountValueMinor,
          minimumSpendMinor,
          isActive,
        ]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        discountType:
          type: string
          enum: [percentage, fixed_amount]
        discountValueMinor:
          type: integer
          minimum: 0
          description: Percentage discounts use basis points; fixed amounts use minor units.
        minimumSpendMinor:
          type: integer
          minimum: 0
          description: Minimum cart spend in minor units required to apply the code.
        isActive:
          type: boolean

    # ------------------------------------------------------------------
    # Request DTOs
    # ------------------------------------------------------------------
    InitializeCartRequest:
      type: object
      required: [regionId, salesChannelId]
      properties:
        regionId:
          type: string
          format: uuid
        salesChannelId:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 254
        countryCode:
          type: string
          pattern: "^[A-Z]{2}$"
          description: ISO 3166-1 alpha-2 country code, uppercased.

    AddLineItemRequest:
      type: object
      required: [variantId, quantity]
      properties:
        variantId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
        metadata:
          type: object
          additionalProperties: true

    AddCustomLineItemRequest:
      type: object
      required: [title, quantity, unitPriceMinor]
      properties:
        title:
          type: string
          maxLength: 1000
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
        unitPriceMinor:
          type: integer
          minimum: 0
          description: Custom unit price in minor units.

    UpdateLineItemQuantityRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000

    ApplyDiscountRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: "^[A-Z0-9-_]+$"
          description: Promotion code; case-insensitive and uppercased server-side.

    MergeGuestCartRequest:
      type: object
      required: [guestCartId, customerId]
      properties:
        guestCartId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid

    SetShippingAddressRequest:
      type: object
      required: [shippingAddress]
      properties:
        shippingAddress:
          $ref: "#/components/schemas/ShippingAddress"

    PaymentSessionRequest:
      type: object
      properties:
        returnUrl:
          type: string
          format: uri
          description: Optional redirect URL hint forwarded to the payment gateway.

    WebhookPaymentFinalizeRequest:
      type: object
      required: [cartId, transactionReference, amountPaidMinor]
      properties:
        cartId:
          type: string
          format: uuid
        transactionReference:
          type: string
          description: Gateway transaction reference; used as the idempotency key.
        amountPaidMinor:
          type: integer
          minimum: 0
          description: Amount captured by the gateway in minor units; must equal the cart total.

    SubmitReviewRequest:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 5000

    AuthenticateRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RegisterCustomerRequest:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
          maxLength: 256
        lastName:
          type: string
          maxLength: 256
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        businessUnitId:
          type: string
          format: uuid
          description: Optional B2B business unit to associate on registration.

    InitiatePasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    CompletePasswordResetRequest:
      type: object
      required: [resetToken, newPassword]
      properties:
        resetToken:
          type: string
          description: Single-use reset token from the email.
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 256

    AddressInput:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        company:
          type: string
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        countryCode:
          type: string
          example: NG
        isDefault:
          type: boolean
          default: false
        metadata:
          type: object
          additionalProperties: true
      additionalProperties: true

    CreateBusinessUnitRequest:
      type: object
      required:
        [unitName, adminCustomerId, companyRegistrationNumber, salesChannelId]
      properties:
        unitName:
          type: string
          maxLength: 256
        adminCustomerId:
          type: string
          format: uuid
        companyRegistrationNumber:
          type: string
          maxLength: 128
        salesChannelId:
          type: string
          format: uuid

    RequestQuoteRequest:
      type: object
      required: [cartId, customerId, businessUnitId]
      properties:
        cartId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        businessUnitId:
          type: string
          format: uuid
        customerNotes:
          type: string
        freezeCart:
          type: boolean
          description: When true, freezes the cart for the quoting period.

    ApproveQuoteRequest:
      type: object
      required: [approvedTotalMinor]
      properties:
        approvedTotalMinor:
          type: integer
          minimum: 0
          description: Approved total in minor units.
        approvalNote:
          type: string

    ReturnRequest:
      type: object
      required: [orderId, items]
      properties:
        orderId:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [lineItemId, quantity, reasonCode]
            properties:
              lineItemId:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 1
              reasonCode:
                type: string
        requireReturnLabel:
          type: boolean
          default: true
          description: When true, a return label is requested from the logistics provider.

    SwapRequest:
      type: object
      required:
        [returnLineItemId, returnQuantity, newVariantId, newVariantPriceMinor]
      properties:
        returnLineItemId:
          type: string
          format: uuid
        returnQuantity:
          type: integer
          minimum: 1
        newVariantId:
          type: string
          format: uuid
        newVariantPriceMinor:
          type: integer
          minimum: 0
          description: Replacement variant unit price in minor units.
        paymentRedirectBaseUrl:
          type: string
          format: uri
          description: Base URL for the payment redirect when variance requires payment.

    ProposeOrderEditRequest:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [type, quantity]
            properties:
              type:
                type: string
                enum: [add, remove, update]
              lineItemId:
                type: string
                format: uuid
              newVariantId:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 1
        reason:
          type: string
          default: ORDER_EDIT_PROPOSAL

    ConfirmOrderEditRequest:
      type: object
      required: [paymentConfirmed]
      properties:
        paymentConfirmed:
          type: boolean
          description: Must be true when the edit increases the order total.
        paymentReference:
          type: string
          nullable: true

    DispatchFulfillmentRequest:
      type: object
      properties:
        preferredCourier:
          type: string
        serviceLevel:
          type: string

    CourierTrackingWebhook:
      type: object
      required: [trackingNumber, courierStatus, timestamp]
      properties:
        trackingNumber:
          type: string
        courierStatus:
          type: string
          enum: [in_transit, out_for_delivery, delivered, failed_attempt]
          description: Raw courier status; unknown values pass through.
        timestamp:
          type: string
          format: date-time
        notifyCustomer:
          type: boolean
          default: true

    CreateProductRequest:
      type: object
      required: [title, handle]
      properties:
        title:
          type: string
        handle:
          type: string
          pattern: "^[a-z0-9-_]+$"
          minLength: 2
          maxLength: 100
          description: Normalized URL handle; lowercased server-side.
        description:
          type: string

    CreateProductVariantRequest:
      type: object
      required: [sku, inventoryQuantity, allowBackorder]
      properties:
        sku:
          type: string
          pattern: "^[A-Z0-9-_]+$"
          description: Normalized to uppercase server-side.
        inventoryQuantity:
          type: integer
          minimum: 0
          maximum: 1000000000
        allowBackorder:
          type: boolean

    AdjustInventoryRequest:
      type: object
      required: [newInventoryQuantity, adjustmentReason]
      properties:
        newInventoryQuantity:
          type: integer
          minimum: 0
          maximum: 1000000000
        adjustmentReason:
          type: string
          description: Required for auditability.

    ConfigureRegionalPricingRequest:
      type: object
      required: [regionId, amountMinor]
      properties:
        regionId:
          type: string
          format: uuid
        amountMinor:
          type: integer
          minimum: 0
          maximum: 100000000000
          description: Regional price in minor units.

    ConfigureTaxCategoryRequest:
      type: object
      required: [name, regionId, taxRateBasisPoints]
      properties:
        name:
          type: string
        regionId:
          type: string
          format: uuid
        taxRateBasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
          description: Tax rate in basis points (e.g. 750 = 7.5%).

    CreatePromotionRequest:
      type: object
      required: [code, discountType, discountValueMinor]
      properties:
        code:
          type: string
          pattern: "^[A-Z0-9-_]+$"
          description: Normalized to uppercase server-side.
        discountType:
          type: string
          enum: [percentage, fixed_amount]
        discountValueMinor:
          type: integer
          minimum: 0
          maximum: 1000000000
          description: Percentage discounts bounded to 10,000 basis points.
        minimumSpendMinor:
          type: integer
          minimum: 0
          maximum: 100000000000

    CreateSalesChannelRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        isDisabled:
          type: boolean
          default: false

    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 200
        parentCategoryId:
          type: string
          format: uuid
          description: Parent category; must exist and cannot reference the new category.

    ManageRolePermissionsRequest:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          minItems: 1
          items:
            type: string
            pattern: "^[a-z0-9]+:[a-z0-9-]+$"
            example: read:products

    BulkImportRequest:
      type: object
      required: [fileUrl]
      properties:
        fileUrl:
          type: string
          format: uri
          description: HTTP(S) URL of the CSV or JSON import file.
        fileType:
          type: string
          enum: [csv, json]

    DraftOrderRequest:
      type: object
      required: [email, items, shippingAddress, adminId]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [title, quantity, unitPriceMinor]
            properties:
              title:
                type: string
              quantity:
                type: integer
                minimum: 1
              unitPriceMinor:
                type: integer
                minimum: 0
        shippingAddress:
          type: object
          additionalProperties: true
          maxLength: 200000
        adminId:
          type: string
        sendInvoice:
          type: boolean
          default: true

    SourcingRequest:
      type: object
      required: [variantId, requestedQuantity]
      properties:
        variantId:
          type: string
          format: uuid
        requestedQuantity:
          type: integer
          minimum: 1
        customerCoordinates:
          type: object
          required: [lat, lng]
          properties:
            lat:
              type: number
              minimum: -90
              maximum: 90
            lng:
              type: number
              minimum: -180
              maximum: 180
        allowSplitAcrossLocations:
          type: boolean
          description: When true, fulfilment may be split across multiple locations.
